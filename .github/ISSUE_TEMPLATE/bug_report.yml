name: "Bug report"
description: "Report an error in the documentation or code examples of this repository."
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a real API key** in an issue — redact it first.

        Account, quota, key or `enrai.web.id` service problems are out of scope for this repository; use the official contact at <https://enrai.web.id>. Security vulnerabilities: follow [SECURITY.md](https://github.com/enraidev/enrai-free-ai-api/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - README.md
        - README.id.md
        - docs/getting-started.md
        - docs/api-reference.md
        - docs/models.md
        - docs/faq.md
        - docs/id (Indonesian docs)
        - examples/python
        - examples/nodejs
        - examples/curl
        - examples/openai-sdk
        - CI / automation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the symptoms you saw, including the error text verbatim.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node.js version, and the example language you used.
      placeholder: "Windows 11, Python 3.12, openai 3.52.0"
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: Source of the facts (for documentation errors)
      description: Link to the <https://enrai.web.id> page that shows the actual behaviour.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have not pasted an API key or personal data in this report.
          required: true
        - label: I searched for similar issues before opening a new one.
          required: true
