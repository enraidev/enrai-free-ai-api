name: "Feature request"
description: "Suggest a code example, a documentation section, or a developer-experience improvement."
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions that get accepted fastest: a new language example, or a documentation section with a clear purpose.

        **Service** features (new models, quotas, new endpoints) are managed at `enrai.web.id`, not in this repository — send them through the official contact or the Discussions Ideas category.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What situation makes you need this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For example "a PHP example with cURL" or "a timeout troubleshooting section".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request can be delivered by changing only this repository (documentation/examples).
          required: true
