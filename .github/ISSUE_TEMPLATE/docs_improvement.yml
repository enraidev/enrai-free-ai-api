name: "Documentation improvement"
description: "Some documentation is wrong, unclear, or behind the site."
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File and section
      placeholder: "docs/api-reference.md → Rate limits"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current content
      description: Quote the sentence or table that is wrong.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What it should say
      description: Write the proposed correction. Include the source link on the site for every number or claim.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The <https://enrai.web.id> page this is based on.
      placeholder: "https://enrai.web.id/pricing"
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I can point to the official site as the source for every claim in this proposal.
          required: true
